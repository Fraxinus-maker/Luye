apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-fokienia-setting
spec:
  forms:
    - group: basic
      label: 基础
      formSchema:
        - $formkit: text
          name: brand_sub
          label: 品牌副标题
          value: "TECH NEWBIE"
          help: 导航栏 Logo 名称下方的小字，建议英文短语。
        - $formkit: attachment
          name: avatar
          label: 站长头像
          value: ""
          help: 用于「关于我」页面、作者页与文章作者信息。留空时使用山峰图标徽章。
        - $formkit: text
          name: search_url
          label: 搜索页链接
          value: ""
          help: 填写后导航栏显示搜索图标按钮（例如安装搜索插件后填 /search）。留空则不显示。
    - group: hero
      label: 首页 Hero
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 显示 Hero 区域
          value: true
        - $formkit: text
          name: eyebrow
          label: 眉题
          value: "TECH NEWBIE · 一个技术小白的折腾记录"
        - $formkit: text
          name: title
          label: 主标题
          value: "小白折腾，步步留痕"
        - $formkit: textarea
          name: subtitle
          label: 副标题
          value: "这里没有高深的技术文章，只有一个新手折腾 VPS、建站、自建服务的真实记录——踩过的坑、走过的弯路都写下来，方便自己回看，也希望能帮到同样在路上的人。"
        - $formkit: attachment
          name: image
          label: 横幅图
          value: ""
          help: Hero 区域底部的意象图，建议宽幅深色图片，留空则不显示。
        - $formkit: text
          name: cta_text
          label: 主按钮文案
          value: "看看我的文章"
        - $formkit: text
          name: cta_anchor
          label: 主按钮目标
          value: "#posts"
          help: 可填页内锚点（如 #posts）或完整链接。
        - $formkit: checkbox
          name: show_stats
          label: 显示数据徽章行
          value: true
          help: 在 CTA 按钮下方展示 文章 / 分类 / 标签 数量徽章，数字使用琥珀色点缀。
        - $formkit: text
          name: stat_visits
          label: 访问量徽章文案
          value: ""
          help: 显示在徽章行末尾（如 12.5k）。站点无统计接入时建议留空隐藏。
    - group: featured
      label: 精选专题
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 显示精选专题
          value: true
        - $formkit: text
          name: eyebrow
          label: 眉题
          value: "FEATURED · 精选专题"
        - $formkit: text
          name: title
          label: 标题
          value: "值得停下来读的几篇"
        - $formkit: textarea
          name: desc
          label: 描述
          value: "自动挑选最近三篇带封面的文章，作为首页的精选入口。"
          help: 精选卡片自动取最近 3 篇设置了封面的文章。
    - group: posts
      label: 文章列表
      formSchema:
        - $formkit: select
          name: layout
          label: 列表布局
          value: "grid"
          options:
            - {label: "双列网格卡（推荐）", value: "grid"}
            - {label: "经典纵向列表", value: "list"}
          help: 置顶文章始终以大卡片展示，其余文章按此布局排列。
    - group: author
      label: 首页作者卡片
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 显示作者卡片
          value: true
        - $formkit: text
          name: eyebrow
          label: 眉题
          value: "ABOUT ME · 关于我"
        - $formkit: text
          name: name
          label: 署名
          value: "Fokienia"
          help: 留空时使用站点标题。
        - $formkit: textarea
          name: bio
          label: 简介
          value: "一个纯粹的技术小白，服务器、建站、网络都没正经玩过，现在完全是摸索状态——走一步、踩一个坑、记一篇笔记。"
    - group: style
      label: 外观
      formSchema:
        - $formkit: color
          name: accent_color
          label: 主题强调色
          value: "#7DD9A6"
        - $formkit: checkbox
          name: weather
          label: 启用天气背景特效
          value: true
          help: 导航栏出现晴 / 雨 / 雪切换按钮，Canvas 粒子背景，用户选择保存在浏览器本地。
        - $formkit: checkbox
          name: webfont
          label: 加载在线衬线字体
          value: true
          help: 加载 Google Fonts 的 Noto Serif SC / Noto Sans SC / Source Serif 4。国内访问缓慢时可关闭，自动回退系统字体。
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: tagline
          label: 页脚标语
          value: "写代码，也写思考。"
        - $formkit: text
          name: email
          label: 联系邮箱
          value: ""
        - $formkit: text
          name: github
          label: GitHub 主页
          value: "https://github.com/Fraxinus-maker"
        - $formkit: text
          name: copyright
          label: 版权文案
          value: "代码与思考"
    - group: footer_pages
      label: 页脚页面
      formSchema:
        - $formkit: checkbox
          name: show_privacy
          label: 显示隐私政策
          value: true
        - $formkit: text
          name: privacy_url
          label: 隐私政策链接
          value: "/privacy-policy"
          help: 改页面正文请前往「内容 → 页面 → 隐私政策」编辑。
        - $formkit: checkbox
          name: show_terms
          label: 显示用户协议
          value: true
        - $formkit: text
          name: terms_url
          label: 用户协议链接
          value: "/user-agreement"
          help: 改页面正文请前往「内容 → 页面 → 用户协议」编辑。
        - $formkit: checkbox
          name: show_about
          label: 显示关于
          value: true
        - $formkit: text
          name: about_url
          label: 关于链接
          value: "/about"
          help: 改页面正文请前往「内容 → 页面 → 关于」编辑。
    - group: friend_links
      label: 友情链接
      formSchema:
        - $formkit: checkbox
          name: show
          label: 显示友情链接
          value: true
        - $formkit: repeater
          name: links
          label: 链接列表
          value: []
          children:
            - $formkit: text
              name: name
              label: 网站名称
              value: ""
            - $formkit: text
              name: url
              label: 网站链接
              value: ""
              help: 填写完整链接，如 https://example.com
